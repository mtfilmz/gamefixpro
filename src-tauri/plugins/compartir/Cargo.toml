[package]
name = "tauri-plugin-compartir"
version = "0.1.0"
edition = "2021"
description = "Abre el menú Compartir de Android con un archivo (la factura en JPG)"
links = "tauri-plugin-compartir"
publish = false

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
