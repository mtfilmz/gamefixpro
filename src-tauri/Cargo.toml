[package]
name = "gamefix"
version = "1.0.0"
description = "Super Mobile Game Fix · programa de Windows y Android"
authors = ["Super Mobile Tech Repair"]
edition = "2021"

[lib]
name = "gamefix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }

# Solo en Windows (y escritorio): actualización automática firmada.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Solo en Android: abrir el menú Compartir con la imagen del recibo.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-compartir = { path = "plugins/compartir" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
